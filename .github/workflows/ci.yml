# Render the template for every framework and run the generated project's lint + tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [sklearn, xgboost, pytorch, tensorflow, none]
    defaults:
      run:
        shell: bash
    env:
      FRAMEWORK: ${{ matrix.framework }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          cache-suffix: ${{ matrix.framework }}
      - name: Render
        run: |
          uvx cookiecutter . --no-input --output-dir out project_name="Test Project" framework="$FRAMEWORK"
          if grep -l 'cookiecutter' out/test-project/.github/workflows/*.yml; then exit 1; fi
          grep -q 'COMET_URL_OVERRIDE:-https://www.comet.com/clientlib/}"' out/test-project/.mcp.json
      - name: Lint and test the generated project
        working-directory: out/test-project
        run: |
          uv sync
          make lint
          make test
      - name: actionlint the generated workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          files: out/test-project/.github/workflows/*.yml
